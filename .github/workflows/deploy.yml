name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump app version
        id: bump
        run: |
          set -euo pipefail
          FILE=backend/src/main/resources/application.properties
          CURRENT=$(grep '^app\.version=' "$FILE" | cut -d= -f2 | tr -d '[:space:]')
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
            echo "Could not parse a numeric app.version from $FILE (got: '$CURRENT')" >&2
            exit 1
          fi
          NEXT=$((CURRENT + 1))
          sed -i "s/^app\.version=.*/app.version=$NEXT/" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to v$NEXT [skip ci]"
          git push

      # The VPS's authorized_keys entry forces the real deploy command, ignoring whatever
      # `script:` below actually sends - it picks up the version bump above since that was
      # pushed to master before this step runs. The intended forced command, kept here so
      # it's documented in version control, is:
      #   git pull && docker compose up -d --build && docker compose restart proxy
      # The trailing `restart proxy` matters: `up -d --build` only recreates a container
      # when its image/build context changed, so a `docker/nginx/proxy.conf` edit alone
      # (the `proxy` service runs the stock `nginx:alpine` image, bind-mounting that file)
      # won't be picked up without it - nginx only reads its config at container startup.
      # If the VPS's forced command doesn't match the line above, update it there too.
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 159.69.94.144
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: echo deploying # the authorized_keys entry on the VPS forces the real command
