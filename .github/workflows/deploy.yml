name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 159.69.94.144
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: echo deploying # the authorized_keys entry on the VPS forces the real command
