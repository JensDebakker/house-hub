spring.application.name=house-hub-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.servlet.context-path=/api

# JWT - override via env vars in real deployments (see docker/.env)
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-minimum}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}

springdoc.swagger-ui.path=/swagger-ui.html

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
