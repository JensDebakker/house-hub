spring.application.name=house-hub-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.servlet.context-path=/api

# JWT - override via env vars in real deployments (see docker/.env)
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-minimum}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}

springdoc.swagger-ui.path=/swagger-ui.html

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Outbound email (verification / password reset) - configure a real SMTP account via env vars.
# Left blank, sending fails silently and the link is still logged at INFO level (see MailService).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${MAIL_FROM:House Hub <no-reply@jensdebakker.com>}
# Base URL of the deployed frontend, used to build links inside verification/reset emails.
app.frontend-url=${FRONTEND_URL:http://localhost:8081}
# Comma-separated emails that get the ADMIN role on registration (or the next startup, if already registered).
app.admin-emails=${ADMIN_EMAILS:jens.debakker@student.vives.be}
# Static key for tools to call GET /admin/** via the X-Admin-Api-Key header, plus DELETE /admin/feedback/{id}. Blank = disabled.
app.admin-api-key=${ADMIN_API_KEY:}

# Bumped by .github/workflows/deploy.yml on every push to master - do not edit by hand.
app.version=200

# Web Push (VAPID) - override via env vars in real deployments (see docker/.env.example).
# The dev-only default pair below is a real, throwaway key pair generated via
# `npx web-push generate-vapid-keys`, not a placeholder - good enough to actually test
# push sends against a dev backend without configuring anything.
push.vapid.public-key=${VAPID_PUBLIC_KEY:BDLm4GjY39ycP6Dg0Gv7Q3OlNGcP8GPN2bKZbuRy0BM1dxQfJ2R0xjSBn_8tiPbW17nOMsmtMNEFefZVFmZqxHo}
push.vapid.private-key=${VAPID_PRIVATE_KEY:DmWrGXTsbHSDenCoBvZxx9Q5GZ7XsCleNH6ohTmHa8k}
push.vapid.subject=${VAPID_SUBJECT:mailto:push@jensdebakker.com}

# House files - blob storage on disk (see docker/.env.example for the mounted volume in prod)
app.files.storage-dir=${FILES_STORAGE_DIR:./data/house-files}
# Sanity ceiling per uploaded file, independent of a household's total storage cap (bytes, default 512MB).
app.files.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:536870912}
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
