# Deployed via docker-compose: Postgres, config from environment (see docker/.env)
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:househub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:househub}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false
